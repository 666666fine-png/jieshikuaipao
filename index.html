<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#141414">
<title>跃动介石</title>
<style>
:root{
  --paper:#f4f3ee;
  --ink:#111110;
  --red:#cf3b2e;
  --gray:#8c8b84;
  --line:#d9d7cf;
  --u:1;
  --sans:"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans CJK SC",sans-serif;
  --serif:"Songti SC","STSong","Noto Serif CJK SC","Noto Serif SC",serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{height:100%;margin:0;overflow:hidden;}
body{
  background:#141414;color:var(--ink);font-family:var(--sans);
  display:flex;align-items:center;justify-content:center;
  touch-action:none;user-select:none;-webkit-user-select:none;overscroll-behavior:none;
}
button{font-family:inherit;color:inherit;}
.stage{
  position:relative;overflow:hidden;background:var(--paper);
  width:min(100vw,56.25dvh,540px);aspect-ratio:9/16;
  box-shadow:0 30px 80px rgba(0,0,0,.45);
}
#game{position:absolute;inset:0;width:100%;height:100%;display:block;}
.hud{
  position:absolute;inset:0;z-index:10;pointer-events:none;
  padding:calc(var(--u)*22px) calc(var(--u)*22px);
}
.hud.hidden{display:none;}
.hud-level{
  font-size:calc(var(--u)*15px);font-weight:800;letter-spacing:.12em;
}
.hud-timer{
  position:absolute;left:50%;top:calc(var(--u)*12px);transform:translateX(-50%);
  text-align:center;min-width:calc(var(--u)*170px);
}
#timerText{
  display:inline-block;font-size:calc(var(--u)*52px);font-weight:900;line-height:1;
  letter-spacing:-.01em;font-variant-numeric:tabular-nums;color:var(--ink);
}
.hud-sec{font-size:calc(var(--u)*11px);font-weight:700;margin-left:calc(var(--u)*3px);}
.hud-goal{
  margin-top:calc(var(--u)*3px);font-size:calc(var(--u)*10px);color:var(--gray);
  letter-spacing:.13em;
}
.hud-actions{
  position:absolute;right:calc(var(--u)*22px);top:calc(var(--u)*22px);
  display:flex;gap:calc(var(--u)*8px);pointer-events:auto;
}
.icon-btn{
  width:calc(var(--u)*34px);height:calc(var(--u)*34px);border:1px solid var(--ink);
  background:transparent;color:var(--ink);display:flex;align-items:center;justify-content:center;
  padding:0;cursor:pointer;
}
.icon-btn:active{background:var(--ink);color:var(--paper);}
.icon-btn svg{width:calc(var(--u)*14px);height:calc(var(--u)*14px);fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;}
.badges{
  position:absolute;left:calc(var(--u)*22px);top:calc(var(--u)*62px);
  display:flex;gap:calc(var(--u)*6px);align-items:center;
}
.badge{
  display:none;align-items:center;gap:calc(var(--u)*4px);
  border:1px solid var(--ink);padding:calc(var(--u)*4px) calc(var(--u)*7px);
  font-size:calc(var(--u)*9px);font-weight:700;letter-spacing:.08em;background:var(--paper);
}
.badge.on{display:inline-flex;}
.badge.slow{border-style:dashed;}
.badge .dot{width:calc(var(--u)*6px);height:calc(var(--u)*6px);background:var(--red);border-radius:50%;}
.tap-guide{
  position:absolute;left:0;right:0;bottom:calc(var(--u)*18px);z-index:9;
  display:flex;justify-content:space-between;padding:0 calc(var(--u)*26px);
  color:#aaa9a2;font-size:calc(var(--u)*10px);font-weight:600;letter-spacing:.12em;
  pointer-events:none;transition:opacity .4s ease;
}
.tap-guide.dim{opacity:.35;}
.flash{
  position:absolute;inset:0;z-index:18;pointer-events:none;background:#fff;opacity:0;
  transition:opacity .12s ease;
}
.screen{
  position:absolute;inset:0;z-index:20;display:none;flex-direction:column;
  align-items:center;justify-content:center;text-align:center;
  background:var(--paper);padding:calc(var(--u)*42px) calc(var(--u)*38px);
}
.screen.on{display:flex;}
.screen::before,.screen::after{
  content:"";position:absolute;left:0;right:0;height:calc(var(--u)*16px);background:var(--ink);
}
.screen::before{top:0;}
.screen::after{bottom:0;}
.menu-title{
  margin:0;font-family:var(--serif);font-weight:900;
  font-size:calc(var(--u)*74px);line-height:1;letter-spacing:.06em;color:var(--ink);
  white-space:nowrap;
}
.menu-title span{color:var(--red);}
.menu-rule{
  width:calc(var(--u)*58px);height:calc(var(--u)*5px);background:var(--red);
  margin:calc(var(--u)*16px) auto calc(var(--u)*18px);
}
.menu-hint{
  margin:0 0 calc(var(--u)*30px);font-size:calc(var(--u)*11px);line-height:1.9;
  color:var(--gray);letter-spacing:.04em;
}
.avatars{display:grid;grid-template-columns:1fr 1fr;gap:calc(var(--u)*16px);width:min(100%,calc(var(--u)*390px));}
.avatar-card{
  appearance:none;border:2px solid var(--line);background:transparent;padding:calc(var(--u)*5px);
  display:flex;flex-direction:column;gap:calc(var(--u)*6px);cursor:pointer;
}
.avatar-card.selected{border-color:var(--ink);}
.avatar-img{width:100%;aspect-ratio:1/1;overflow:hidden;background:#ddd;display:block;}
.avatar-img img{width:100%;height:100%;object-fit:cover;display:block;filter:grayscale(1) contrast(1.03);}
.avatar-name{font-size:calc(var(--u)*11px);font-weight:700;letter-spacing:.14em;}
.btn{
  appearance:none;border:1px solid var(--ink);background:var(--ink);color:var(--paper);
  font-weight:800;letter-spacing:.2em;cursor:pointer;
  padding:calc(var(--u)*15px) calc(var(--u)*34px);font-size:calc(var(--u)*14px);
  min-width:calc(var(--u)*210px);
}
.btn:active{background:var(--paper);color:var(--ink);}
.btn.ghost{background:transparent;color:var(--ink);}
.btn.ghost:active{background:var(--ink);color:var(--paper);}
.btn.small{min-width:calc(var(--u)*132px);padding:calc(var(--u)*11px) calc(var(--u)*20px);font-size:calc(var(--u)*12px);}
.start-wrap{margin-top:calc(var(--u)*30px);width:100%;display:flex;justify-content:center;}
.menu-note{
  margin-top:calc(var(--u)*22px);font-size:calc(var(--u)*10px);color:var(--gray);letter-spacing:.08em;
}

/* ---------- 主界面 / 选人 / 赞赏 ---------- */
.victory-level{margin:calc(var(--u)*14px) 0 0;font-size:calc(var(--u)*11px);font-weight:700;letter-spacing:.16em;color:var(--gray);}
.rest-screen{justify-content:center;padding:calc(var(--u)*40px) calc(var(--u)*34px);}
.rest-message{
  margin:0;max-width:calc(var(--u)*390px);font-family:var(--serif);font-size:calc(var(--u)*22px);
  font-weight:800;line-height:1.65;letter-spacing:.04em;
}
.rest-countdown{
  margin:calc(var(--u)*22px) 0 calc(var(--u)*26px);font-size:calc(var(--u)*62px);font-weight:900;line-height:1;
}
.rest-countdown small{font-size:calc(var(--u)*14px);font-weight:700;margin-left:calc(var(--u)*5px);letter-spacing:.1em;}
.rest-screen .btn:disabled{opacity:.32;cursor:default;background:var(--ink);color:var(--paper);}

.sfx{display:none;}
.screen.home{
  justify-content:flex-start;text-align:center;
  padding:calc(var(--u)*38px) calc(var(--u)*30px) calc(var(--u)*26px);
}
.home-title{
  margin:0;font-family:var(--serif);font-weight:900;
  font-size:calc(var(--u)*56px);line-height:1;letter-spacing:.05em;white-space:nowrap;
}
.home-title span{color:var(--red);}
.home-rule{width:calc(var(--u)*42px);height:calc(var(--u)*4px);background:var(--red);margin:calc(var(--u)*12px) auto 0;}
.home-hero-wrap{
  width:100%;display:flex;justify-content:center;
  margin:calc(var(--u)*6px) 0 calc(var(--u)*2px);
  pointer-events:none;
}
.home-hero{
  width:calc(var(--u)*232px);height:auto;display:block;
  filter:drop-shadow(0 calc(var(--u)*10px) calc(var(--u)*16px) rgba(0,0,0,.14));
  transform-origin:50% 92%;
  animation:heroSway 4.4s ease-in-out infinite;
}
@keyframes heroSway{
  0%,100%{transform:translateX(calc(var(--u)*-11px)) rotate(-2.2deg);}
  50%{transform:translateX(calc(var(--u)*11px)) rotate(2.2deg);}
}
.home-lead{
  margin:0;font-size:calc(var(--u)*16px);font-weight:800;letter-spacing:.03em;line-height:1.5;
}
.home-desc{
  margin:calc(var(--u)*8px) auto 0;font-size:calc(var(--u)*10.5px);line-height:1.85;
  color:var(--gray);letter-spacing:.02em;max-width:calc(var(--u)*360px);
}
.home-meta{
  margin:calc(var(--u)*6px) 0 0;font-size:calc(var(--u)*9.5px);color:var(--gray);letter-spacing:.06em;
}
.home-actions{margin-top:calc(var(--u)*17px);display:flex;justify-content:center;width:100%;}
.home-actions .btn{min-width:calc(var(--u)*220px);}
.support-line{
  margin:calc(var(--u)*18px) 0 0;
  color:#1c66d8;font-size:calc(var(--u)*11.5px);line-height:1.8;letter-spacing:.015em;
}
.support-link{
  appearance:none;border:0;background:none;padding:0;margin:0;color:#1c66d8;
  font:inherit;font-weight:700;text-decoration:underline;text-underline-offset:calc(var(--u)*2px);
  cursor:pointer;
}
.support-link:active{opacity:.65;}
.select-screen{padding-top:calc(var(--u)*56px);padding-bottom:calc(var(--u)*46px);}
.select-screen .panel-title{margin-bottom:calc(var(--u)*26px);}
.select-screen .avatars{width:min(100%,calc(var(--u)*400px));gap:calc(var(--u)*18px);}
.select-screen .avatar-card{padding:calc(var(--u)*5px);}
.select-screen .avatar-name{display:none;}
.select-actions{display:flex;flex-wrap:wrap;gap:calc(var(--u)*10px);justify-content:center;margin-top:calc(var(--u)*30px);}
.reward-modal{
  position:absolute;inset:0;z-index:50;display:none;align-items:center;justify-content:center;
  background:rgba(17,17,16,.58);padding:calc(var(--u)*28px);
}
.reward-modal.on{display:flex;}
.reward-card{
  position:relative;width:min(94%,calc(var(--u)*430px));background:var(--paper);
  padding:calc(var(--u)*10px);box-shadow:0 calc(var(--u)*18px) calc(var(--u)*50px) rgba(0,0,0,.35);
}
.reward-card img{display:block;width:100%;height:auto;background:#fff;}
.reward-close{
  position:absolute;right:calc(var(--u)*-12px);top:calc(var(--u)*-12px);
  width:calc(var(--u)*34px);height:calc(var(--u)*34px);border:1px solid var(--ink);
  background:var(--ink);color:var(--paper);font-size:calc(var(--u)*19px);line-height:1;
  cursor:pointer;display:flex;align-items:center;justify-content:center;padding:0;
}
@media (prefers-reduced-motion:reduce){.home-hero{animation:none;}}

/* clear / gameover / pause */
.panel-kicker{font-size:calc(var(--u)*10px);font-weight:700;letter-spacing:.24em;color:var(--gray);margin:0 0 calc(var(--u)*12px);}
.panel-title{margin:0;font-family:var(--serif);font-size:calc(var(--u)*40px);font-weight:900;letter-spacing:.08em;}
.panel-sub{margin:calc(var(--u)*12px) 0 calc(var(--u)*28px);font-size:calc(var(--u)*12px);color:var(--gray);letter-spacing:.1em;}
.panel-actions{display:flex;flex-wrap:wrap;gap:calc(var(--u)*10px);justify-content:center;}
/* victory */
.victory{padding-top:calc(var(--u)*36px);padding-bottom:calc(var(--u)*36px);}
.victory-photo{
  width:min(70%,calc(var(--u)*330px));background:#fff;padding:calc(var(--u)*7px);
  border:1px solid var(--ink);transform:rotate(-.6deg);
}
.victory-photo img{width:100%;display:block;filter:grayscale(.15) contrast(1.02);}
.victory-title{
  margin:calc(var(--u)*22px) 0 0;font-family:var(--serif);font-size:calc(var(--u)*48px);
  font-weight:900;letter-spacing:.18em;
}
.victory-slogan{
  margin:calc(var(--u)*12px) 0 calc(var(--u)*22px);font-family:var(--serif);
  font-size:calc(var(--u)*24px);font-weight:700;line-height:1.55;letter-spacing:.08em;
}
.victory .btn{min-width:calc(var(--u)*150px);}
.victory-actions{display:flex;gap:calc(var(--u)*10px);flex-wrap:wrap;justify-content:center;}
/* banner */
.banner{
  position:absolute;left:50%;top:calc(var(--u)*48%);z-index:15;transform:translate(-50%,-50%);
  background:var(--ink);color:var(--paper);padding:calc(var(--u)*14px) calc(var(--u)*26px);
  text-align:center;opacity:0;transition:opacity .25s ease;pointer-events:none;
}
.banner.show{opacity:1;}
.banner-title{font-size:calc(var(--u)*20px);font-weight:800;letter-spacing:.16em;}
.banner-sub{margin-top:calc(var(--u)*5px);font-size:calc(var(--u)*10px);letter-spacing:.16em;opacity:.72;}
/* rotate hint */
.rotate-hint{display:none;}
@media (orientation:landscape) and (max-height:520px){
  .rotate-hint{
    display:block;position:fixed;bottom:10px;left:0;right:0;text-align:center;
    color:#8b8a84;font-size:11px;letter-spacing:.12em;
  }
}
</style>
</head>
<body>
<main class="stage" id="stage">
  <canvas id="game" width="540" height="960"></canvas>

  <div class="hud hidden" id="hud">
    <div class="hud-level">第 <span id="levelNum">1</span> 关</div>
    <div class="hud-timer">
      <span id="timerText">15.0</span><span class="hud-sec">秒</span>
      <div class="hud-goal" id="hudGoal">坚持 15 秒</div>
    </div>
    <div class="hud-actions">
      <button class="icon-btn" id="pauseBtn" aria-label="暂停">
        <svg viewBox="0 0 24 24"><path d="M8 5v14M16 5v14"/></svg>
      </button>
    </div>
    <div class="badges">
      <span class="badge" id="shieldBadge"><i class="dot"></i>睡衣</span>
      <span class="badge slow" id="slowBadge">拖鞋 <b id="slowTime">4.0</b>s</span>
    </div>
  </div>

  <div class="tap-guide" id="tapGuide"><span>← 左半屏</span><span>右半屏 →</span></div>

function playerRect() {
  const p = game.player;
  return { x: p.x + 7, y: p.y + 7, w: SIZE - 14, h: SIZE - 14 };
}

function rectsOverlap(a, b) {
  return a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y;
}

function fitStage() {
  const rect = stage.getBoundingClientRect();
  if (rect.width < 2 || rect.height < 2) return;
  document.documentElement.style.setProperty('--u', String(rect.width / W));
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  const cw = Math.round(rect.width * dpr);
  const ch = Math.round(rect.height * dpr);
  if (canvas.width !== cw || canvas.height !== ch) {
    canvas.width = cw;
    canvas.height = ch;
    ctx.imageSmoothingEnabled = true;
    ctx.imageSmoothingQuality = 'high';
  }
  viewScaleX = cw / W;
  viewScaleY = ch / H;
}

  Object.values(dom.screens).forEach((el) => el.classList.remove('on'));

    const on = card.dataset.avatar === game.avatar;
    card.classList.toggle('selected', on);
    card.setAttribute('aria-pressed', on ? 'true' : 'false');
  });
}

function updateHud(force = false) {
  const now = performance.now();
  if (!force && now - lastHudUpdate < 60) return;
  lastHudUpdate = now;
  dom.levelNum.textContent = String(game.level);
  dom.timerText.textContent = Math.max(0, game.timeLeft).toFixed(1);
  dom.hudGoal.textContent = `坚持 ${game.cfg.time} 秒`;
  dom.shieldBadge.classList.toggle('on', game.shield);
  const slow = game.slowLeft > 0;
  dom.slowBadge.classList.toggle('on', slow);
  if (slow) dom.slowTime.textContent = game.slowLeft.toFixed(1);
}

/* ---------- 游戏状态 ---------- */

function playerJump(dir) {
  if (game.state !== 'playing') return;
  if (!game.started) {
    game.started = true;
    hideBanner();
  }
  const now = performance.now();
  const sameDir = dir === game.lastDir && now - game.lastTapAt < 210;
  const p = game.player;
  p.vx = dir * JUMP_VX * (sameDir ? 1.22 : 1);
  p.vy = -JUMP_VY * (sameDir ? 1.16 : 1);
  game.lastDir = dir;
  game.lastTapAt = now;
  playJumpSound();
}

/* ---------- 跳跃音效：从视频中提取的完整单次音效 ---------- */
let audioCtx = null;
let jumpBuffer = null;
let jumpBufferPromise = null;

function ensureAudio() {
  if (!audioCtx) {
    try {
      const Ctx = window.AudioContext || window.webkitAudioContext;
      if (!Ctx) return;
      audioCtx = new Ctx();
      const audioEl = document.getElementById('jumpSound');
      const src = audioEl ? (audioEl.getAttribute('src') || audioEl.src || '') : '';
      const comma = src.indexOf(',');
      if (comma > 0) {
        const bin = atob(src.slice(comma + 1));
        const bytes = new Uint8Array(bin.length);
        for (let i = 0; i < bin.length; i += 1) bytes[i] = bin.charCodeAt(i);
        jumpBufferPromise = audioCtx.decodeAudioData(bytes.buffer).then((buf) => {
          jumpBuffer = buf;
        }).catch(() => {});
      }
    } catch (e) {
      audioCtx = null;
    }
  }
  if (audioCtx && audioCtx.state === 'suspended') {
    audioCtx.resume().catch(() => {});
  }
}

function playJumpSound() {
  ensureAudio();
  if (!audioCtx) return;
  const play = () => {
    if (!jumpBuffer) return;
    try {
      const source = audioCtx.createBufferSource();
      source.buffer = jumpBuffer;
      const gain = audioCtx.createGain();
      gain.gain.value = 0.62;
      source.connect(gain);
      gain.connect(audioCtx.destination);
      source.start(0);
      game.jumpSoundCount += 1;
    } catch (e) {
      /* 音频不可用时静默 */
    }
  };
  if (jumpBuffer) play();
  else if (jumpBufferPromise) jumpBufferPromise.then(play).catch(() => {});
}

function startLevel(n) {
  game.level = clamp(n, 1, levels.length);
  game.cfg = levels[game.level - 1];
  game.timeLeft = game.cfg.time;
  game.state = 'playing';
  game.started = false;
  game.invincible = false;
  game.player = { x: W / 2 - SIZE / 2, y: 610, vx: 0, vy: 0, tilt: 0 };
  game.obstacles = [];
  game.items = [];
  game.bullets = [];
  game.fieldScroll = 0;
  game.spawnTimer = 0.65;
  game.itemTimer = 2.0;
  game.intro = 0;
  game.timeScale = 1;
  game.slowLeft = 0;
  game.shield = false;
  game.invuln = 0;
  game.deathTimer = 0;
  game.lastDir = 0;
  game.lastTapAt = -9999;
  game.lastGapCenter = W / 2;
  game.soldierCount = 0;
  game.shooterCount = 0;
  game.speechLine = 0;
  hideScreens();
  showHud(true);
  showBanner(`第 ${game.level} 关`, `坚持 ${game.cfg.time} 秒`, 60000);
  updateHud(true);
}

function startCampaign() {
  startLevel(1);
}

function completeLevel() {
  if (game.state !== 'playing') return;
  const final = game.level >= levels.length;
  game.state = final ? 'victory' : 'clear';
  game.failStreak = 0;
  hideBanner();
  showHud(false);
  hideScreens();
  setFlash(80);
  dom.victoryLevelLabel.textContent = final ? '全部关卡完成' : `第 ${game.level} 关 完成`;
  dom.victoryTitle.textContent = final ? '全部通关' : '通关成功';
  dom.playAgainBtn.textContent = final ? '再玩一次' : '继续下一关';
  showScreen('victory');
}

function showVictory() {
  if (game.state === 'playing') {
    game.level = levels.length;
    completeLevel();
  } else {
    const final = game.level >= levels.length;
    game.state = final ? 'victory' : 'clear';
    hideBanner();
    showHud(false);
    hideScreens();
    dom.victoryLevelLabel.textContent = final ? '全部关卡完成' : `第 ${game.level} 关 完成`;
    dom.victoryTitle.textContent = final ? '全部通关' : '通关成功';
    dom.playAgainBtn.textContent = final ? '再玩一次' : '继续下一关';
    showScreen('victory');
  }
}

function die(cause) {
  if (game.state !== 'playing') return;
  game.state = 'dying';
  game.deathTimer = 0;
  game.deathCause = cause || 'hit';
  game.failStreak += 1;
  hideBanner();
  showHud(false);
  setFlash(240);
}

function showGameover() {
  if (game.failStreak >= 3) {
    showRestScreen();
    return;
  }
  game.state = 'gameover';
  hideBanner();
  showHud(false);
  hideScreens();
  dom.gameoverSub.textContent = `第 ${game.level} 关 · 坚持了 ${(game.cfg.time - Math.max(0, game.timeLeft)).toFixed(1)} 秒`;
  showScreen('gameover');
}

function showRestScreen() {
  game.state = 'rest';
  game.restDeadline = performance.now() + 30000;
  game.restReady = false;
  hideBanner();
  hideScreens();
  showHud(false);
  setFlash(120);
  dom.restCountdown.textContent = '30';
  dom.restBackBtn.disabled = true;
  dom.restBackBtn.textContent = '休息中';
  showScreen('rest');
}

function updateRest() {
  if (game.state !== 'rest') return;
  const left = Math.max(0, Math.ceil((game.restDeadline - performance.now()) / 1000));
  dom.restCountdown.textContent = String(left);
  if (left <= 0 && !game.restReady) {
    game.restReady = true;
    game.failStreak = 0;
    dom.restBackBtn.disabled = false;
    dom.restBackBtn.textContent = '返回主界面';
  }
}

function goHome() {
  game.state = 'home';
  hideBanner();
  hideScreens();
  showHud(false);
  closeReward();
  showScreen('home');
  updateAvatarUI();
}

function openSelect() {
  game.state = 'select';
  hideBanner();
  hideScreens();
  showHud(false);
  showScreen('select');
}

function openReward() {
  if (!dom.rewardModal) return;
  dom.rewardModal.classList.add('on');
  dom.rewardModal.setAttribute('aria-hidden', 'false');
}

function closeReward() {
  if (!dom.rewardModal) return;
  dom.rewardModal.classList.remove('on');
  dom.rewardModal.setAttribute('aria-hidden', 'true');
}

function pauseGame() {
  if (game.state !== 'playing') return;
  game.state = 'paused';
  hideBanner();
  showHud(false);
  hideScreens();
  showScreen('pause');
}

function resumeGame() {
  if (game.state !== 'paused') return;
  game.state = 'playing';
  hideScreens();
  showHud(true);
  lastTime = performance.now();
}

/* ---------- 生成 ---------- */

function spawnBar() {
  const side = chance(0.5) ? -1 : 1;
  const w = rand(100, 175);
  game.obstacles.push({
    kind: 'bar',
    side,
    x: side < 0 ? 0 : W - w,
    y: -28,
    w,
    h: 26,
  });
}

function spawnBlock() {
  const w = rand(34, 54);
  game.obstacles.push({
    kind: 'block',
    x: rand(24, W - 24 - w),
    y: -64,
    w,
    h: w,
  });
}

function spawnSoldier() {
  const cfg = game.cfg;
  const forcedStatic = game.level === 1;
  const isStatic = forcedStatic || chance(cfg.staticChance);
  let shooter = false;
  if (cfg.shooting) {
    const forced = game.soldierCount >= 2 && game.shooterCount === 0;
    shooter = chance(cfg.shooterChance) || forced;
  }
  if (shooter) game.shooterCount += 1;
  const baseX = rand(44, W - 44 - 36);
  const s = {
    kind: 'soldier',
    x: baseX,
    baseX,
    y: -84,
    w: 36,
    h: 54,
    static: isStatic,
    phase: rand(0, Math.PI * 2),
    amp: isStatic ? 0 : rand(24, 56),
    moveSpeed: isStatic ? 0 : cfg.soldierMove * rand(0.8, 1.2),
    shooter,
    shootTimer: rand(1.0, 2.1),
    bubble: null,
    bubbleAge: 0,
    bubbleAlive: 0,
  };
  s.bubble = SOLDIER_LINES[game.speechLine % SOLDIER_LINES.length];
  game.speechLine += 1;
  s.bubbleAlive = 2.4;
  game.obstacles.push(s);
  game.soldierCount += 1;
}

function spawnPattern() {
  const cfg = game.cfg;

  if (game.level === 1 && game.timeLeft <= 5.2 && game.soldierCount < 2) {
    spawnSoldier();
    game.spawnTimer = cfg.interval * 1.05;
    return;
  }

  const roll = Math.random();
  if (cfg.soldierChance > 0 && roll < cfg.soldierChance) {
    spawnSoldier();
  } else if (roll < cfg.soldierChance + cfg.blockChance) {
    spawnBlock();
  } else {
    spawnBar();
  }
  game.spawnTimer = cfg.interval * rand(0.94, 1.07);
}

function spawnItem() {
  const first = game.items.length === 0 && game.level <= 2;
  let type;
  if (first) type = game.level === 1 ? 'pajama' : 'slipper';
  else type = chance(0.5) ? 'pajama' : 'slipper';
  if (type === 'pajama' && game.shield && chance(0.7)) type = 'slipper';
  game.items.push({
    kind: 'item',
    type,
    x: rand(54, W - 54 - 36),
    y: -42,
    w: 36,
    h: 36,
    bob: rand(0, 6.28),
  });
  game.itemTimer = rand(7.5, 10.5);
}

/* ---------- 更新 ---------- */

function update(realStep) {
  if (game.state === 'dying') {
    game.deathTimer += realStep;
    if (game.deathTimer > 0.5) showGameover();
    return;
  }
  if (game.state !== 'playing') return;

  if (!game.started) {
    updateHud();
    return;
  }

  if (game.slowLeft > 0) game.slowLeft = Math.max(0, game.slowLeft - realStep);
  const target = game.slowLeft > 0 ? 0.55 : 1;
  game.timeScale += (target - game.timeScale) * Math.min(1, realStep * 9);
  const dt = realStep * game.timeScale;

  game.timeLeft -= dt;
  if (game.timeLeft <= 0) {
    game.timeLeft = 0;
    updateHud(true);
    completeLevel();
    return;
  }

  updatePlayer(dt);
  if (game.state !== 'playing') return;
  updateWorld(dt);
  if (game.invuln > 0) game.invuln = Math.max(0, game.invuln - realStep);
  updateHud();
}

function updatePlayer(dt) {
  const p = game.player;
  p.vy += GRAVITY * dt;
  p.x += p.vx * dt;
  p.y += p.vy * dt;
  if (p.x < 0) { p.x = 0; p.vx = 0; }
  if (p.x > W - SIZE) { p.x = W - SIZE; p.vx = 0; }
  if (p.y < 0) { p.y = 0; if (p.vy < 0) p.vy = 0; }
  if (p.y < 175) {
    const shift = 175 - p.y;
    p.y = 175;
    game.obstacles.forEach((o) => { o.y += shift; });
    game.items.forEach((it) => { it.y += shift; });
    game.bullets.forEach((b) => { b.y += shift; });
    game.fieldScroll += shift;
  }
  p.tilt += ((p.vx / 2600) - p.tilt) * Math.min(1, dt * 12);
  if (p.tilt > 0.13) p.tilt = 0.13;
  if (p.tilt < -0.13) p.tilt = -0.13;
  if (p.y > H + 16) die('fall');
}

function updateWorld(dt) {
  const cfg = game.cfg;
  game.fieldScroll += cfg.speed * dt;
  game.levelDistance += cfg.speed * dt;

  for (const o of game.obstacles) {
    o.y += cfg.speed * dt;
    if (o.kind === 'soldier') {
      if (!o.static) {
        o.phase += dt * (o.moveSpeed / 26);
        o.x = clamp(o.baseX + Math.sin(o.phase) * o.amp, 0, W - o.w);
      }
      if (o.bubbleAlive > 0 && o.y > 200) {
        o.bubbleAge += dt;
        o.bubbleAlive -= dt;
      }
      if (o.shooter && o.y > 0 && o.y < H - 100) {
        o.shootTimer -= dt;
        if (o.shootTimer <= 0) {
          o.shootTimer = rand(2.4, 3.6);
          game.bullets.push({
            x: o.x + o.w / 2 - 5,
            y: o.y + o.h,
            w: 10,
            h: 10,
            speed: cfg.bulletSpeed || 255,
          });
          setFlash(45);
        }
      }
    }
  }

  for (const b of game.bullets) b.y += b.speed * dt;
  for (const it of game.items) {
    it.y += cfg.speed * dt;
    it.bob += dt * 3;
  }

  game.spawnTimer -= dt;
  if (game.spawnTimer <= 0) spawnPattern();

  game.itemTimer -= dt;
  if (game.itemTimer <= 0) spawnItem();

  handleCollisions();

  game.obstacles = game.obstacles.filter((o) => o.y < H + 120);
  game.bullets = game.bullets.filter((b) => b.y < H + 24);
  game.items = game.items.filter((it) => it.y < H + 60);
}

function handleCollisions() {
  const pr = playerRect();
  if (game.invuln > 0) return;

  for (const o of game.obstacles) {
    if (rectsOverlap(pr, { x: o.x, y: o.y, w: o.w, h: o.h })) {
      if (trySurviveHit()) return;
      return;
    }
  }

  for (const b of game.bullets) {
    if (rectsOverlap(pr, { x: b.x, y: b.y, w: b.w, h: b.h })) {
      if (trySurviveHit()) {
        b.y = H + 200;
        return;
      }
      return;
    }
  }
}

function trySurviveHit() {
  if (game.invincible || game.invuln > 0) return true;
  if (game.shield) {
    game.shield = false;
    game.invuln = 1.4;
    setFlash(160);
    updateHud(true);
    return true;
  }
  die('hit');
  return false;
}

function collectItem(it) {
  if (it.type === 'pajama') {
    if (!game.shield) game.shield = true;
    game.invuln = Math.max(game.invuln, 0.35);
  } else {
    game.slowLeft = 4.0;
  }
  setFlash(60);
  updateHud(true);
}

function checkItems() {
  const pr = playerRect();
  for (let i = game.items.length - 1; i >= 0; i -= 1) {
    const it = game.items[i];
    const box = { x: it.x, y: it.y, w: it.w, h: it.h };
    if (rectsOverlap(pr, box)) {
      game.items.splice(i, 1);
      collectItem(it);
    }
  }
}

/* ---------- 主循环 ---------- */

const STEP = 1 / 120;
const MAX_FRAME = 0.05;

function frame(t) {
  if (!lastTime) lastTime = t;
  const raw = Math.min((t - lastTime) / 1000, MAX_FRAME);
  lastTime = t;

  if (game.state === 'playing' || game.state === 'dying') {
    accumulator += raw;
    let guard = 0;
    while (accumulator >= STEP && guard < 10) {
      update(STEP);
      checkItems();
      accumulator -= STEP;
      guard += 1;
      if (game.state !== 'playing' && game.state !== 'dying') break;
    }
    if (guard >= 10) accumulator = 0;
  } else {
    accumulator = 0;
  }
  if (game.state === 'rest') updateRest();

  render();
  requestAnimationFrame(frame);
}

/* ---------- 渲染 ---------- */

function render() {
  ctx.setTransform(viewScaleX, 0, 0, viewScaleY, 0, 0);
  ctx.fillStyle = PAPER;
  ctx.fillRect(0, 0, W, H);

  drawField();

  if (game.state === 'home' || game.state === 'select') return;

  for (const o of game.obstacles) drawObstacle(o);
  for (const it of game.items) drawItem(it);
  for (const b of game.bullets) drawBullet(b);
  drawPlayer();
  for (const o of game.obstacles) {
    if (o.kind === 'soldier' && o.bubbleAlive > 0) drawSpeech(o);
  }

  if (game.slowLeft > 0) {
    ctx.fillStyle = 'rgba(17,17,16,0.035)';
    ctx.fillRect(0, 0, W, H);
    ctx.strokeStyle = 'rgba(17,17,16,0.18)';
    ctx.setLineDash([7, 7]);
    ctx.lineWidth = 1;
    ctx.strokeRect(6, 6, W - 12, H - 12);
    ctx.setLineDash([]);
  }
}

function drawField() {
  ctx.fillStyle = PAPER;
  ctx.fillRect(0, 0, W, H);
}

function drawObstacle(o) {
  ctx.fillStyle = INK;
  if (o.kind === 'bar' || o.kind === 'block') {
    ctx.fillRect(o.x, o.y, o.w, o.h);
    return;
  }
  if (o.kind === 'soldier') {
    const x = o.x;
    const y = o.y;
    ctx.fillRect(x + 3, y + 14, o.w - 6, o.h - 14);
    ctx.fillRect(x, y + 6, o.w, 10);
    ctx.fillRect(x + 5, y + 2, o.w - 10, 6);
    ctx.fillStyle = PAPER;
    ctx.fillRect(x + 8, y + 19, 8, 3);
    ctx.fillRect(x + o.w - 16, y + 19, 8, 3);
    ctx.fillStyle = RED;
    ctx.fillRect(x + 3, y + 34, 5, 8);
    ctx.fillStyle = INK;
    ctx.fillRect(x - 9, y + 36, 14, 3);
    if (o.shooter) {
      ctx.fillStyle = PAPER;
      ctx.fillRect(x - 13, y + 40, 5, 2);
    }
    return;
  }
}

function drawPlayer() {
  const p = game.player;
  if (!p) return;
  const img = images[game.avatar];
  if (!img) return;
  const drawSize = 54;
  ctx.save();
  ctx.translate(p.x + SIZE / 2, p.y + SIZE / 2);
  ctx.rotate(p.tilt || 0);
  const alpha = game.invuln > 0 ? 0.45 + 0.35 * Math.abs(Math.sin(performance.now() / 55)) : 1;
  ctx.globalAlpha = alpha;
  ctx.imageSmoothingQuality = 'high';
  ctx.drawImage(img, -drawSize / 2, -drawSize / 2, drawSize, drawSize);
  ctx.restore();
}

function drawItem(it) {
  const bob = Math.sin(it.bob) * 3;
  const x = it.x;
  const y = it.y + bob;
  ctx.save();
  ctx.fillStyle = PAPER;
  ctx.fillRect(x, y, it.w, it.h);
  ctx.strokeStyle = INK;
  ctx.lineWidth = 1.6;
  ctx.strokeRect(x + 0.8, y + 0.8, it.w - 1.6, it.h - 1.6);
  ctx.fillStyle = RED;
  ctx.fillRect(x + it.w - 8, y + 2, 6, 3);

  ctx.strokeStyle = INK;
  ctx.lineWidth = 1.5;
  ctx.lineCap = 'round';
  if (it.type === 'pajama') {
    ctx.beginPath();
    ctx.moveTo(x + 10, y + 12);
    ctx.lineTo(x + 5, y + 15);
    ctx.lineTo(x + 8, y + 22);
    ctx.lineTo(x + 11, y + 20);
    ctx.lineTo(x + 11, y + 29);
    ctx.lineTo(x + 25, y + 29);
    ctx.lineTo(x + 25, y + 20);
    ctx.lineTo(x + 28, y + 22);
    ctx.lineTo(x + 31, y + 15);
    ctx.lineTo(x + 26, y + 12);
    ctx.quadraticCurveTo(x + 20, y + 16, x + 18, y + 16);
    ctx.quadraticCurveTo(x + 16, y + 16, x + 10, y + 12);
    ctx.closePath();
    ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(x + 11, y + 21);
    ctx.lineTo(x + 25, y + 21);
    ctx.moveTo(x + 11, y + 25);
    ctx.lineTo(x + 25, y + 25);
    ctx.stroke();
    ctx.fillStyle = INK;
    ctx.font = `700 9px "PingFang SC",sans-serif`;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText('睡衣', x + it.w / 2, y + it.h - 6);
  } else {
    ctx.beginPath();
    ctx.ellipse(x + 17, y + 24, 8, 11, -0.35, 0, Math.PI * 2);
    ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(x + 17, y + 14);
    ctx.quadraticCurveTo(x + 27, y + 14, x + 28, y + 21);
    ctx.stroke();
    ctx.fillStyle = RED;
    ctx.beginPath();
    ctx.arc(x + 24, y + 15, 2, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = INK;
    ctx.font = `700 9px "PingFang SC",sans-serif`;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText('拖鞋', x + it.w / 2, y + it.h - 5);
  }
  ctx.restore();
}

function drawBullet(b) {
  ctx.fillStyle = 'rgba(17,17,16,0.18)';
  ctx.fillRect(b.x + 3, b.y - 16, 4, 16);
  ctx.fillStyle = INK;
  ctx.fillRect(b.x, b.y, b.w, b.h);
  ctx.fillStyle = RED;
  ctx.fillRect(b.x + 2, b.y + 2, 2, 2);
}

function drawSpeech(s) {
  const text = s.bubble;
  if (!text || s.y < 200) return;
  const fade = Math.min(1, s.bubbleAlive / 0.3);
  const y = s.y - 34;
  const x = clamp(s.x + s.w / 2, 66, W - 66);
  ctx.save();
  ctx.globalAlpha = clamp(fade, 0, 1);
  ctx.font = `700 13px "Songti SC","STSong","Noto Serif CJK SC",serif`;
  const w = Math.max(90, ctx.measureText(text).width + 24);
  const h = 28;
  const left = clamp(x - w / 2, 8, W - w - 8);
  ctx.fillStyle = PAPER;
  ctx.strokeStyle = INK;
  ctx.lineWidth = 1.5;
  ctx.fillRect(left, y - h, w, h);
  ctx.strokeRect(left + 0.75, y - h + 0.75, w - 1.5, h - 1.5);
  ctx.beginPath();
  ctx.moveTo(x - 6, y - 1);
  ctx.lineTo(x + 2, y + 9);
  ctx.lineTo(x + 9, y - 1);
  ctx.closePath();
  ctx.fillStyle = PAPER;
  ctx.fill();
  ctx.stroke();
  ctx.fillStyle = INK;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText(text, left + w / 2, y - h / 2 + 0.5);
  ctx.restore();
}

/* ---------- 输入 / 按钮 ---------- */

function bind() {
  dom.avatarCards.forEach((card) => {
    card.addEventListener('click', () => {
      game.avatar = card.dataset.avatar === 'bunny' ? 'bunny' : 'cat';
      try { localStorage.setItem('ydj.avatar', game.avatar); } catch (e) {}
      updateAvatarUI();
    });
  });

  dom.homeStartBtn.addEventListener('click', () => {
    ensureAudio();
    openSelect();
  });
  dom.selectStartBtn.addEventListener('click', () => {
    ensureAudio();
    hideScreens();
    startCampaign();
  });
  dom.selectBackBtn.addEventListener('click', () => goHome());
  dom.rewardLink.addEventListener('click', (e) => {
    e.preventDefault();
    openReward();
  });
  dom.rewardClose.addEventListener('click', () => closeReward());
  dom.rewardModal.addEventListener('click', (e) => {
    if (e.target === dom.rewardModal) closeReward();
  });

  dom.pauseBtn.addEventListener('click', () => pauseGame());
  dom.nextBtn.addEventListener('click', () => {
    hideScreens();
    startLevel(game.level + 1);
  });
  dom.clearMenuBtn.addEventListener('click', () => goHome());
  dom.retryBtn.addEventListener('click', () => {
    hideScreens();
    startLevel(game.level);
  });
  dom.gameoverMenuBtn.addEventListener('click', () => goHome());
  dom.resumeBtn.addEventListener('click', () => resumeGame());
  dom.restartPauseBtn.addEventListener('click', () => {
    hideScreens();
    startLevel(game.level);
  });
  dom.pauseMenuBtn.addEventListener('click', () => goHome());
  dom.playAgainBtn.addEventListener('click', () => {
    hideScreens();
    if (game.state === 'clear') startLevel(game.level + 1);
    else startCampaign();
  });
  dom.victoryMenuBtn.addEventListener('click', () => goHome());
  dom.restBackBtn.addEventListener('click', () => {
    if (!game.restReady) return;
    hideScreens();
    goHome();
  });

  stage.addEventListener('pointerdown', (e) => {
    ensureAudio();
    if (e.target.closest('button, .screen')) return;
    if (game.state !== 'playing') return;
    e.preventDefault();
    const r = stage.getBoundingClientRect();
    playerJump((e.clientX - r.left) / r.width < 0.5 ? -1 : 1);
  }, { passive: false });

  window.addEventListener('keydown', (e) => {
    ensureAudio();
    if (e.code === 'Escape' && dom.rewardModal.classList.contains('on')) {
      closeReward();
      e.preventDefault();
      return;
    }
    if (e.code === 'ArrowLeft' || e.code === 'KeyA') {
      e.preventDefault();
      playerJump(-1);
    } else if (e.code === 'ArrowRight' || e.code === 'KeyD') {
      e.preventDefault();
      playerJump(1);
    } else if (e.code === 'KeyP' || e.code === 'Escape') {
      if (game.state === 'playing') pauseGame();
      else if (game.state === 'paused') resumeGame();
    } else if (e.code === 'KeyR') {
      if (game.state === 'gameover') {
        hideScreens();
        startLevel(game.level);
      }
    } else if (e.code === 'Enter') {
      if (game.state === 'home') {
        openSelect();
      } else if (game.state === 'select') {
        hideScreens();
        startCampaign();
      } else if (game.state === 'clear') {
        hideScreens();
        startLevel(game.level + 1);
      }
    }
  });

  document.addEventListener('visibilitychange', () => {
    if (document.hidden && game.state === 'playing') pauseGame();
  });

  window.addEventListener('resize', fitStage);
  window.addEventListener('orientationchange', () => setTimeout(fitStage, 200));
  window.addEventListener('contextmenu', (e) => {
    if (e.target.closest('#stage')) e.preventDefault();
  });
}

/* ---------- 调试接口 ---------- */

function setupDebug() {
  window.YDJ = {
    state: () => ({
      state: game.state,
      started: game.started,
      invincible: game.invincible,
      level: game.level,
      timeLeft: game.timeLeft,
      timeScale: game.timeScale,
      shield: game.shield,
      slowLeft: game.slowLeft,
      avatar: game.avatar,
      player: game.player ? { ...game.player } : null,
      obstacleCount: game.obstacles.length,
      obstacles: game.obstacles.map((o) => ({ kind: o.kind, x: Math.round(o.x), y: Math.round(o.y), w: Math.round(o.w), h: Math.round(o.h), side: o.side, static: o.static, shooter: o.shooter })),
      soldiers: game.obstacles.filter((o) => o.kind === 'soldier').length,
      shooters: game.obstacles.filter((o) => o.kind === 'soldier' && o.shooter).length,
      bullets: game.bullets.length,
      lines: SOLDIER_LINES.slice(),
      audioReady: Boolean(audioCtx && jumpBuffer),
      jumpSoundCount: game.jumpSoundCount,
      jumpSoundDuration: jumpBuffer ? Math.round(jumpBuffer.duration * 1000) / 1000 : null,
      failStreak: game.failStreak,
      restReady: game.restReady,
      screen: document.querySelector('.screen.on') ? document.querySelector('.screen.on').id : null,
    }),
    start: (n = 1, autostart = true) => {
      hideScreens();
      startLevel(n);
      if (autostart) { game.started = true; hideBanner(); }
      return window.YDJ.state();
    },
    setInvincible: (v = true) => { game.invincible = Boolean(v); return window.YDJ.state(); },
    begin: () => { if (!game.started) { game.started = true; hideBanner(); } return window.YDJ.state(); },
    jump: (dir) => { playerJump(dir); return window.YDJ.state(); },
    setTimer: (s) => { game.timeLeft = Math.max(0, Number(s) || 0); updateHud(true); return window.YDJ.state(); },
    setShield: (v = true) => { game.shield = Boolean(v); updateHud(true); return window.YDJ.state(); },
    giveItem: (type) => { if (type === 'slipper') game.slowLeft = 4; else game.shield = true; updateHud(true); return window.YDJ.state(); },
    spawn: (kind) => {
      if (game.state !== 'playing') return null;
      if (kind === 'soldier') spawnSoldier();
      else if (kind === 'block') spawnBlock();
      else spawnBar();
      return window.YDJ.state();
    },
    winLevel: () => { if (game.state === 'playing') { game.timeLeft = 0; completeLevel(); } return window.YDJ.state(); },
    showVictory: () => { showVictory(); return window.YDJ.state(); },
    die: () => { die('hit'); return window.YDJ.state(); },
    home: () => { goHome(); return window.YDJ.state(); },
    select: () => { openSelect(); return window.YDJ.state(); },
    audioReady: () => Boolean(audioCtx && jumpBuffer),
    pause: () => { pauseGame(); return window.YDJ.state(); },
    resume: () => { resumeGame(); return window.YDJ.state(); },
  };
}

/* ---------- 启动 ---------- */

function boot() {
  try {
    const stored = localStorage.getItem('ydj.avatar');
    if (stored === 'cat' || stored === 'bunny') game.avatar = stored;
  } catch (e) {}
  updateAvatarUI();
  fitStage();
  new ResizeObserver(fitStage).observe(stage);

  const catImg = $('.avatar-card[data-avatar="cat"] .avatar-img img');
  const bunnyImg = $('.avatar-card[data-avatar="bunny"] .avatar-img img');
  const victoryImg = $('#victoryPhoto');
  const load = (img) => new Promise((resolve) => {
    if (!img) return resolve();
    if (img.complete && img.naturalWidth) return resolve();
    img.addEventListener('load', resolve, { once: true });
    img.addEventListener('error', resolve, { once: true });
  });
  Promise.all([load(catImg), load(bunnyImg), load(victoryImg)]).then(() => {
    images = { cat: catImg, bunny: bunnyImg };
    if (victoryImg) images.victory = victoryImg;
  });

  // 保证图片源已就绪时也取一次
  images = { cat: catImg, bunny: bunnyImg };
  if (victoryImg) images.victory = victoryImg;

  bind();
  setupDebug();
  game.state = 'home';
  showHud(false);
  hideScreens();
  showScreen('home');
  closeReward();
  lastTime = performance.now();
  requestAnimationFrame(frame);
}

boot();

</script>
</body>
</html>
